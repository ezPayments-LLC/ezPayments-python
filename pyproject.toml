[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezpayments"
version = "0.1.0"
description = "Python SDK for ezPayments Merchant API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ezPayments", email = "support@ezpayments.co"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.25.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.20"]

[project.urls]
Homepage = "https://github.com/elkhayyat/ezpayments-python"
Documentation = "https://docs.ezpayments.co"
Repository = "https://github.com/elkhayyat/ezpayments-python"
Issues = "https://github.com/elkhayyat/ezpayments-python/issues"

[tool.setuptools.packages.find]
include = ["ezpayments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
